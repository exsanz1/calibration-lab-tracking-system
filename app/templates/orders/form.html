{% extends "base.html" %}
{% block title %}{{ 'Edit' if order else 'New' }} Order - CalibTrack{% endblock %}
{% block content %}
<div class="mb-6">
    <a href="/orders" class="text-text-muted hover:text-text-main text-sm">← Back to Orders</a>
    <h2 class="text-2xl font-bold text-text-main mt-2">{{ 'Edit' if order else 'New' }} Order</h2>
</div>

<div class="bg-surface rounded-xl shadow-sm border border-slate-200 p-6 max-w-2xl">
    <form method="post" action="/orders/save" class="space-y-4">
        {% if order %}
        <input type="hidden" name="order_id" value="{{ order.id }}">
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-text-main mb-1">Customer *</label>
            <select name="customer_id" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
                <option value="">Select customer...</option>
                {% for c in customers %}
                <option value="{{ c.id }}" {% if order and order.customer_id == c.id %}selected{% endif %}>{{ c.company_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">Quotation No</label>
                <input type="text" name="quotation_no" value="{{ order.quotation_no if order and order.quotation_no else '' }}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">PO No</label>
                <input type="text" name="po_no" value="{{ order.po_no if order and order.po_no else '' }}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">PO Status</label>
                <select name="po_status"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
                    {% for s in po_statuses %}
                    <option value="{{ s.value }}" {% if order and order.po_status == s %}selected{% endif %}>{{ s.value }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">Service Type *</label>
                <select name="service_type" required
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
                    {% for s in service_types %}
                    <option value="{{ s.value }}" {% if order and order.service_type == s %}selected{% endif %}>{{ s.value | replace('_', ' ') }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-text-main mb-1">BAST No</label>
            <input type="text" name="bast_no" value="{{ order.bast_no if order and order.bast_no else '' }}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">Received Date</label>
                <input type="date" name="received_date" value="{{ order.received_date if order and order.received_date else '' }}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-text-main mb-1">Target SLA Date</label>
                <input type="date" name="target_sla_date" value="{{ order.target_sla_date if order and order.target_sla_date else '' }}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-text-main mb-1">Invoice Status</label>
            <select name="invoice_status"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-[#0099FF] focus:border-[#0099FF] outline-none">
                {% for s in invoice_statuses %}
                <option value="{{ s.value }}" {% if order and order.invoice_status == s %}selected{% endif %}>{{ s.value }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="bg-brand-primary hover:bg-brand-hover text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors">
                {{ 'Update' if order else 'Create' }} Order
            </button>
            <a href="/orders" class="px-6 py-2 rounded-lg text-sm font-medium text-text-muted hover:bg-slate-100 transition-colors">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
